<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Brilliant Dance Festival</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div id="login-screen" class="login-screen" hidden>
  <div class="login-card">
    <h1>Brilliant Dance Festival</h1>
    <p class="sub">Admin login</p>
    <div class="login-error" id="login-error"></div>
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    <button class="primary" id="login-btn">Log In</button>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand">Brilliant Dance Festival<small>Admin</small></div>
    <nav id="nav-items"></nav>
    <div class="spacer"></div>
    <button class="nav-item logout" id="logout-btn">Log Out</button>
  </aside>
  <div class="main">
    <div class="topbar">
      <span class="status" id="save-status">All changes saved</span>
      <div class="actions">
        <a class="outline" style="text-decoration:none;padding:11px 22px;border:1px solid var(--navy);border-radius:120px;color:var(--navy);font-size:0.84rem;font-weight:600;" href="/index.html" target="_blank">View Site</a>
        <button class="primary" id="save-btn">Save &amp; Publish</button>
      </div>
    </div>
    <div class="content" id="content-panel"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/admin/admin.js"></script>
</body>
</html>
